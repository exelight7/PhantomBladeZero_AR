name: Build and publish release
on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Tag the current commit with the package.json version and publish the release'
        type: boolean
        default: false
      pak_only:
        description: 'Skip the EXE/AppImage builds and publish only the pak files, manual ZIP and checksums'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    if: ${{ !inputs.pak_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/prepare_release.py
      - run: npm ci
        working-directory: installer
      - run: npm test
        working-directory: installer
      - name: Linux UI test
        if: runner.os == 'Linux'
        run: npx electron --ozone-platform=headless --disable-gpu --no-sandbox scripts/smoke.cjs
        working-directory: installer
      - run: npm run build:linux
        if: runner.os == 'Linux'
        working-directory: installer
      - run: npm run build:windows
        if: runner.os == 'Windows'
        working-directory: installer
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*-manual.zip
          if-no-files-found: error
  publish:
    if: ${{ always() && (startsWith(github.ref, 'refs/tags/') || inputs.publish) && (needs.build.result == 'success' || inputs.pak_only) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.pak_only }}
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Prepare pak-only assets
        if: ${{ inputs.pak_only }}
        run: |
          python -m unittest discover -s tests -v
          python tools/prepare_release.py --pak-assets
          python tools/prepare_release.py --pak-assets --checksums
      - run: python tools/prepare_release.py --checksums
        if: ${{ !inputs.pak_only }}
      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG="$(python -c 'import json; print(json.load(open("installer/package.json"))["version"])')"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            test "${TAG#v}" = "$PKG"
            TARGET="--verify-tag"
          else
            TAG="$PKG"
            TARGET="--target $GITHUB_SHA"
          fi
          if [ "${{ inputs.pak_only }}" = "true" ]; then
            ASSETS="dist/exelight7_P.pak dist/exelight7_P.utoc dist/exelight7_P.ucas dist/PhantomBladeZero-AR-$PKG-manual.zip dist/SHA256SUMS.txt"
          else
            ASSETS="dist/*.exe dist/*.AppImage dist/*-manual.zip dist/SHA256SUMS.txt"
          fi
          gh release create "$TAG" $ASSETS $TARGET --title "$PKG — Phantom Blade Zero بالعربية" --notes-file "release/NOTES-$PKG.md" --latest
